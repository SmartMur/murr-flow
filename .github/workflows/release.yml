name: Release

# Builds an unsigned Murr-flow.app, packages it into a DMG, and publishes a GitHub
# Release. Fires on any `v*` tag push (e.g. `git tag v0.1.0 && git push origin v0.1.0`)
# or manually via workflow_dispatch.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish DMG
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # Package.swift declares swift-tools-version 6.2, but the runner defaults to an
      # older Xcode (Swift 6.1) and fails to even parse the manifest. Select the newest
      # Xcode present rather than pinning a version that will age out of the image.
      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Swift version
        run: swift --version

      # The app target needs macOS 26 and the Speech framework. If the macos-15 runner
      # image does not yet ship the macOS 26 SDK, `make app CONFIG=release` fails with a
      # clear SDK error — the fix is to update runs-on to a runner image that carries the
      # macOS 26 SDK, not to change the code.
      - name: Build the release app bundle
        run: make app CONFIG=release

      - name: Capture release metadata
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUNDLE=$HOME/Library/Caches/MurrFlowBuild/Murr-flow.app" >> "$GITHUB_ENV"

      - name: Create the DMG
        run: |
          set -euo pipefail
          DMG="$RUNNER_TEMP/Murr-flow-$VERSION.dmg"
          hdiutil create -volname "Murr-flow" -srcfolder "$BUNDLE" -ov -format UDZO "$DMG"
          hdiutil verify "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --title "Murr-flow $TAG" \
            --notes "$(cat <<'NOTES'
          Native macOS push-to-talk dictation. Hold a key, talk, release — text appears at the cursor.

          ## Install

          1. Download `Murr-flow-${{ env.VERSION }}.dmg` below.
          2. Open the .dmg and drag **Murr-flow** to `/Applications`.
          3. This build is **unsigned**, so macOS Gatekeeper blocks it on first launch. Do one of:
             - Right-click `Murr-flow.app` in `/Applications` → **Open** → **Open**, or
             - Run in Terminal:
               ```bash
               xattr -dr com.apple.quarantine "/Applications/Murr-flow.app"
               ```
          4. Launch Murr-flow and grant **Accessibility** and **Microphone** permissions when prompted (both required).
          5. Hold **fn** and speak. Release to transcribe and inject at the cursor.
          NOTES
          )" \
            "$DMG"
