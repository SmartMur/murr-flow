name: CI / macOS

# Runs the shared dictionary contract against the Swift implementation. The Windows
# workflow runs the identical vectors against the C# one. Both must be green for the two
# implementations to be considered in agreement — that pairing is the whole point.

on:
  push:
    branches: [main]
    paths: ['Sources/**', 'Tests/**', 'shared/**', 'Resources/**', 'Makefile', 'Package.swift', '.github/workflows/macos.yml', '.github/workflows/release.yml']
  pull_request:
    paths: ['Sources/**', 'Tests/**', 'shared/**', 'Resources/**', 'Makefile', 'Package.swift', '.github/workflows/macos.yml', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dictionary-contract:
    name: Dictionary contract
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Package.swift declares swift-tools-version 6.2, but the runner defaults to an
      # older Xcode (Swift 6.1) and fails to even parse the manifest. Select the newest
      # Xcode present rather than pinning a version that will age out of the image.
      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Swift version
        run: swift --version

      # The dictionary target is deliberately platform-neutral, so the shared correction
      # contract is still validated independently of the full app bundle build below.
      - name: Test the dictionary target
        run: swift test --filter VectorTests

      - name: Confirm the vectors on both sides are identical
        run: |
          if ! diff -q shared/dictionary-test-vectors.json Tests/MurmurDictionaryTests/dictionary-test-vectors.json; then
            echo "::error::The Swift test copy of the vectors has drifted from shared/."
            echo "Run: cp shared/dictionary-test-vectors.json Tests/MurmurDictionaryTests/"
            exit 1
          fi
          echo "Vectors match."

  app-build:
    name: App build smoke
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Swift version
        run: swift --version

      - name: Build the universal release app bundle
        run: make app CONFIG=release ARCHS="arm64 x86_64"

      - name: Confirm universal binary slices
        run: |
          BIN="$HOME/Library/Caches/MurrFlowBuild/Murr-flow.app/Contents/MacOS/MurrFlow"
          archs="$(lipo -archs "$BIN")"
          echo "$archs"
          [[ "$archs" == *"x86_64"* ]]
          [[ "$archs" == *"arm64"* ]]

      - name: Upload unsigned app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Murr-flow-app-${{ github.sha }}
          path: ~/Library/Caches/MurrFlowBuild/Murr-flow.app
          if-no-files-found: error
